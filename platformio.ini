[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
; Serial upload/monitor settings
; De TRONG upload_port/monitor_port thi PlatformIO tu do port. KHONG dat "= auto":
; esptool hieu do la ten port that va bao "Could not open auto".
; Neu tu do sai (nhieu board cung cam), them dong upload_port = COM15 (Windows) hoac
; upload_port = /dev/ttyACM0 (Linux).
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1

; Sau moi lan build, copy firmware.bin sang C:/fw/giasach.bin de mot HTTP server duy nhat
; phuc vu ca 3 phong voi URL ngan, khong dung nhau (ca 3 project dung cung ten env nen
; duong dan .pio/build/... cua chung giong het nhau). Xem tools/copy_fw.py.
extra_scripts = post:tools/copy_fw.py
custom_fw_name = giasach
custom_fw_out = C:/fw