; Node PHU cua he gia sach: chi doc 2 sensor TCRT5000 va ban trang thai ve node chinh qua
; ESP-NOW. Khong Ethernet, khong MQTT/OSC, khong Web UI - moi thu do node chinh lo.
;
; Day la PROJECT RIENG (mo thu muc node_sensor/ trong PlatformIO), khong phai them env vao
; project goc: hai firmware nap vao hai board khac nhau, de lan lon neu chung mot env list.

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Header giao thuc dung chung voi node chinh - xem shared/giasach_espnow.h
    -I../shared
